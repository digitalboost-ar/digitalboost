<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DigitalBoost</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background:#0f0f0f;
    color:#fff;
    font-family:'Segoe UI',system-ui,sans-serif;
}

/* HERO */
.hero{
    padding:70px 20px 40px;
    text-align:center;
}
.hero h1{
    font-weight:800;
}
.hero p{
    opacity:.7;
}

/* GRID 2x2 */
.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:30px;
    max-width:900px;
    margin:auto;
}

@media(max-width:768px){
    .grid{
        grid-template-columns:1fr;
    }
}

/* CARD */
.card-platform{
    position:relative;
    height:260px;
    border-radius:26px;
    overflow:hidden;
    box-shadow:0 20px 50px rgba(0,0,0,.7);
    transition:transform .35s ease, box-shadow .35s ease;
}

.card-platform:hover{
    transform:translateY(-8px);
    box-shadow:0 35px 80px rgba(0,0,0,.9);
}

.card-platform img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* OVERLAY */
.overlay{
    position:absolute;
    inset:0;
    background:linear-gradient(180deg,transparent 30%,rgba(0,0,0,.85));
    display:flex;
    align-items:flex-end;
    padding:26px;
}

.overlay h3{
    font-weight:800;
    margin:0;
}

.overlay span{
    font-size:.9rem;
    opacity:.75;
}

/* FOOTER */
footer{
    margin-top:80px;
    background:#0a0a0a;
    color:#777;
    font-size:.85rem;
}
</style>
</head>

<body>

<!-- HERO -->
<section class="hero">
    <div class="container">
        <h1>DigitalBoost</h1>
        <p>Accesos digitales a plataformas premium</p>
    </div>
</section>

<!-- GRID 2x2 -->
<section class="pb-5">
    <div class="grid">

        <!-- NETFLIX -->
        <a href="netflix.html" class="text-decoration-none text-white">
            <div class="card-platform">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRCPFBAYC5FgdF9sEs-RHFrOr8w8Dj0b-qmOc5DNGOGf5df7Bwp__pa34Q&s=10">
                <div class="overlay">
                    <div>
                        <h3>Netflix</h3>
                        <span>Series y películas</span>
                    </div>
                </div>
            </div>
        </a>

        <!-- DISNEY -->
        <a href="disney.html" class="text-decoration-none text-white">
            <div class="card-platform">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRh1RFNbnwiHk93j7oe6V63sv30nZcIb_xBiZy7wTEslIp1Pb0dhWEI7W8&s=10">
                <div class="overlay">
                    <div>
                        <h3>Disney+</h3>
                        <span>Marvel • Pixar • Star Wars</span>
                    </div>
                </div>
            </div>
        </a>

        <!-- HBO -->
        <a href="hbomax.html" class="text-decoration-none text-white">
            <div class="card-platform">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT8FKxRYNqvIp8lTHan_q3PM7OAralc3rkiLgcnpGq2tyrmUeC2JnqLEXg&s=10">
                <div class="overlay">
                    <div>
                        <h3>HBO Max</h3>
                        <span>Series premium</span>
                    </div>
                </div>
            </div>
        </a>

        <!-- CRUNCHYROLL -->
        <a href="crunchyroll.html" class="text-decoration-none text-white">
            <div class="card-platform">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR2SNK0xSKVoMKqonIp1-1YI0niMYtdB6-H5a5NYpHOAUQA67A0MRjI3VU&s=10">
                <div class="overlay">
                    <div>
                        <h3>Crunchyroll</h3>
                        <span>Anime & simulcast</span>
                    </div>
                </div>
            </div>
        </a>
        <!-- HBO -->
        <a href="xbox.html" class="text-decoration-none text-white">
            <div class="card-platform">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRA_-lH7FcF7gyQ-pMTa6VQjzWc34dCIV-DRb9Z8h8twKVWZFPVAIakseag&s=10">
                <div class="overlay">
                    <div>
                        <h3>Xbox game pass</h3>
                        <span>pc•consola•nube</span>
                    </div>
                </div>
            </div>
        </a>
        
    </div>
</section>

<!-- FOOTER -->
<footer class="py-4 text-center">
    <div class="container">
        <p class="mb-1">© 2026 • DigitalBoost</p>
        <p class="opacity-50">Las marcas pertenecen a sus respectivos dueños.</p>
    </div>
</footer>

</body>
</html>
